[package]
name = "aether-installer"
version = "1.0.0"
edition = "2021"
description = "AETHER desktop installer, repair and uninstall TUI"
license = "MIT"
repository = "https://github.com/aether-desktop/AETHER"

[[bin]]
name = "aether-installer"
path = "src/main.rs"

[lib]
name = "aether_installer"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
include_dir = "0.7"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
