      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="0.42" stop-color="#111527"/>
      <stop offset="1" stop-color="#07080e"/>
    </radialGradient>
    <radialGradient id="aurora" cx="50%" cy="50%" r="50%">
