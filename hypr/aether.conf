# AETHER static Hyprland configuration
# This file contains input, binds and session integration. Visual values such as
# gaps, borders, rounding, blur and animations are generated by
#   aether hyprland --apply
# and sourced from ~/.config/hypr/aether/generated.conf.
#
# The AETHER installer backs up existing configuration before adding the
# managed include. Review this file before sourcing it yourself.

$mod = SUPER
$terminal = aether-terminal --working-directory ~
$fileManager = aether files

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── Startup ──────────────────────────────────────────────────────────────────
exec-once = aether shell
# Start a wallpaper backend if you use one. AETHER does not install or start
# these for you; uncomment the one you actually have.
# exec-once = swww-daemon
# exec-once = hyprpaper

# ── Input ────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 280
}

# ── AETHER desktop bindings ──────────────────────────────────────────────────
bind = $mod, D, global, aether:launcher
bind = $mod, A, global, aether:dashboard
bind = $mod, N, global, aether:notifications
bind = $mod, S, global, aether:quick-settings
bind = $mod, Escape, global, aether:power

bind = $mod, Return, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod SHIFT, M, global, aether:music
bind = $mod SHIFT, P, global, aether:monitor
bind = $mod SHIFT, S, global, aether:settings

# ── Window management ────────────────────────────────────────────────────────
bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, P, pseudo,
bind = $mod, O, togglesplit,

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, J, movewindow, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ── Media and hardware keys ──────────────────────────────────────────────────
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Session ──────────────────────────────────────────────────────────────────
bind = $mod SHIFT, Q, exit,
bind = $mod CTRL, L, exec, loginctl lock-session

# ── AETHER windows ───────────────────────────────────────────────────────────
windowrulev2 = float, class:^(aether-power)$
windowrulev2 = size 440 560, class:^(aether-power)$
windowrulev2 = center, class:^(aether-power)$
windowrulev2 = float, class:^(aether-settings)$
windowrulev2 = size 1120 760, class:^(aether-settings)$
windowrulev2 = center, class:^(aether-settings)$
windowrulev2 = float, class:^(aether-music)$
windowrulev2 = size 1040 680, class:^(aether-music)$
windowrulev2 = center, class:^(aether-music)$
windowrulev2 = float, class:^(aether-files)$
windowrulev2 = size 1160 760, class:^(aether-files)$
windowrulev2 = center, class:^(aether-files)$

# ── Misc ─────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

xwayland {
    force_zero_scaling = true
}

# AETHER's generated visual settings.
source = ~/.config/hypr/aether/generated.conf
